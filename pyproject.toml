[project]
name = "md2api"
version = "0.6.3"
description = ""
authors = [
    { name = "sumeshi", email = "sum3sh1@protonmail.com" },
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "gitpython>=3.2.0",
    "markdown>=3.10.3",
    "pymdown-extensions>=12.1",
]

[project.scripts]
md2api = 'md2api.run:main'

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/md2api"]
